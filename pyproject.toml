[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macrt"
version = "0.1.0"
description = "Run classic Mac OS (System 1-7) applications with a PyQt6 front end"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyQt6>=6.5", "unicorn>=2.1", "rsrcfork>=1.8", "machfs>=1.3",
                "macextract.py @ git+https://github.com/adespoton/macextract.py"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
macrt = "macrt.demo:main"
disktracker = "disktracker.__main__:main"

[tool.setuptools.packages.find]
include = ["macrt*", "disktracker*"]

[tool.setuptools.package-data]
"macrt.ui" = ["fonts/*", "icons/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
